        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
        matchPlanningEnabled:
          type: boolean
          default: false
          description: Opt-in flag for Match Formats/Formations/lineup planning.
        matchFormats:
          type: array
          items:
            $ref: '#/components/schemas/MatchFormat'
          description: Squad-scoped only; never shared with other squads.
        formations:
          type: array
          items:
            $ref: '#/components/schemas/Formation'
          description: Squad-scoped only; never shared with other squads.

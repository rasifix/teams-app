        active:
          type: boolean
          description: Set to false to deactivate the squad without deleting its data. Requires admin or trainer role.
    SquadCategory:
      type: string
      enum: [A, B, C, D9, D7, E, F, G, FF9, FF11, FF14, FF17]
      description: Swiss Football Association (SFV) team category.
    CreatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

        kind:
          type: string
          enum: [match, tournament]
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        matchFormatId:
          type: string
          nullable: true
        opponentName:
          type: string
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityInvitation'
    ShirtAssignment:
      type: object
      properties:
        playerId:
          type: string
          
        shirtNumber:
          type: integer
          minimum: 1
      required:
        - playerId
        - shirtNumber
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        strength:
          type: integer
          minimum: 1
          maximum: 3
          default: 2
        startTime:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "14:30"
        location:
          type: string
          description: Optional location for the team (overrides activity location)
        selectedPlayers:
          type: array
          items:
            type: string
        selectionRemovals:
          type: array
          description: Audit trail of players removed after the selection was sent.
          items:
            $ref: '#/components/schemas/SelectionRemoval'
        responsiblePersonId:
          type: string
          nullable: true
        shirtSetId:
          type: string
          nullable: true
        shirtAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ShirtAssignment'
          nullable: true
        formationId:
          type: string
          nullable: true
          description: >-
            References a Formation in the same squad. Only settable while the
            Activity has a non-null matchFormatId. Fixed for the whole
            match.
        lineup:
          type: array
          items:
            $ref: '#/components/schemas/TeamLineupPeriod'
          nullable: true
          description: One entry per planned period; unlisted periods are unplanned.
      required:
        - id
        - name
        - strength
        - selectedPlayers
    SelectionRemoval:
      type: object
      properties:
        playerId:
          type: string
        reason:
          type: string
          enum: [sick, injured, noShow, other]
        removedAt:
          type: string
          format: date-time
      required: [playerId, reason, removedAt]
    Shirt:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: string
          enum: ['128', '140', '152', '164', 'XS', 'S', 'M', 'L', 'XL']
        isGoalkeeper:
          type: boolean
        status:
          type: string
          enum: [available, unavailable]
          default: available
      required:
        - number
        - size
        - isGoalkeeper
    ShirtSet:
      type: object
      properties:
        id:
          type: string
          
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - id
        - sponsor
        - color
        - shirts
    CreateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
    UpdateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
tags:
  - name: Authentication
    description: User registration and authentication endpoints
  - name: Health
    description: API health check endpoints
  - name: Squads
    description: Operations on squads for organizing teams
  - name: Members
    description: Operations on members (players and trainers) within a squad
  - name: Evaluations
    description: Operations on player evaluations within a squad
  - name: Shirt Sets
    description: Operations on shirt sets and equipment within a squad

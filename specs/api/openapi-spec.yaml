        - name
        - startDate
        - endDate
    UpdatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    MatchFormat:
      type: object
      description: >-
        Squad-scoped subresource (see Squad.matchFormats). Never referenced
        across squads.
      properties:
        id:
          type: string
        name:
          type: string
          example: "4x20"
        numberOfPeriods:
          type: integer
          minimum: 1
          example: 4
        periodLengthMinutes:
          type: integer
          minimum: 1
          example: 20
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          example: 2
          default: 0
          description: >-
            Minimum number of distinct periods in which every selected player
            should have a field assignment. Must not exceed numberOfPeriods.
            Zero disables the minimum-playing-time rule. Violations are
            advisory and do not prevent saving a team lineup.
        isDefault:
          type: boolean
          default: false
          description: Exactly one Match Format per squad may be true.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
      required:
        - id
        - name
        - numberOfPeriods
        - periodLengthMinutes
        - minimumPeriodsPerPlayer
    CreateMatchFormatRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Must not exceed numberOfPeriods. Zero disables the rule.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
      required:
        - name
        - numberOfPeriods
        - periodLengthMinutes
        - minimumPeriodsPerPlayer
    UpdateMatchFormatRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          description: >-
            Must not exceed the resulting numberOfPeriods. Zero disables the
            rule.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
    PositionCode:
      type: string
      description: >-
        Language-neutral position abbreviation (same catalog as used in
        games like FIFA). Translating a code into a localized label (e.g.
        English "LB" for "left back" vs. German "LV" for "linker
        Verteidiger") is a frontend i18n concern; the backend only stores
        and validates the code.
      enum:
        - GK
        - LB
        - CB
        - RB
        - LWB
        - RWB
        - CDM
        - CM
        - CAM
        - LM
        - RM
        - LW
        - RW
        - CF
        - ST
    FormationSlot:
      type: object
      properties:
        id:
          type: string
        positionCode:
          $ref: '#/components/schemas/PositionCode'
      required:
        - id
        - positionCode
    Formation:
      type: object
      description: >-
        Squad-scoped subresource (see Squad.formations). Never referenced
        across squads.
      properties:
        id:
          type: string
        name:
          type: string
          example: "3-3"
        slots:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FormationSlot'
          description: >-
            Exactly one slot must have positionCode GK; other codes may
            repeat (e.g. two CB slots), distinguished only by array order.
      required:
        - id
        - name
        - slots
    CreateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
      required:
        - name
        - slots
    UpdateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id:
                type: string
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
    LineupPositionAssignment:
      type: object

openapi: 3.0.3
info:
  title: Teams API
  description: API for managing soccer teams, players, trainers, activities, and equipment
  version: 1.0.0
  contact:
    name: Teams API Support
    email: support@teams-api.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.teams.com
    description: Production server
# Authentication is optional for most endpoints, but required for some
security: []
paths:
  /api/birthday-calendars/{token}.ics:
    get:
      operationId: getBirthdayCalendarFeed
      summary: Subscribe to a squad birthday calendar
      description: >-
        Public bearer-link calendar feed containing annually recurring, all-day
        birthdays for active players. The feed includes player names and birthday
        month/day, but does not expose birth years or ages. Revoking the squad's
        subscription invalidates the token.
      tags: [Squads]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: iCalendar birthday feed
          content:
            text/calendar:
              schema: { type: string }
        '404': { description: Calendar not found or revoked }
  /api/squads/{squadId}/birthday-calendar:
    get:
      operationId: getBirthdayCalendarSubscription
      summary: Get the squad birthday calendar subscription
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current subscription URL, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [subscriptionUrl]
                properties:
                  subscriptionUrl: { type: string, format: uri, nullable: true }
        '403': { description: Admin or trainer access required }
    post:
      operationId: createBirthdayCalendarSubscription
      summary: Create the squad birthday calendar subscription
      description: Returns the existing link when a subscription is already active.
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Existing subscription URL }
        '201': { description: Subscription URL created }
        '403': { description: Admin or trainer access required }
    delete:
      operationId: revokeBirthdayCalendarSubscription
      summary: Revoke the squad birthday calendar subscription
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Subscription revoked }
        '403': { description: Admin or trainer access required }
  /api/sfv-categories:
    get:
      operationId: getSfvCategories
      summary: Get the SFV category catalog
      description: >-
        Read-only catalog data provided for Phase 2. The response identifies
        the catalog date and distinguishes categories that play tournaments
        from categories with a default match format.
      tags:
        - Squads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SfvCategoryCatalog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/integrations/spond/groups:
    post:
      operationId: proxySpondGroups
      summary: List Spond groups through the optional read-only proxy
      description: >-
        Credentials and the resulting Spond token are request-scoped and must
        never be persisted or logged. This operation is used when initially
        choosing a group to link. Scoped player and event synchronization use
        the Squad's existing spondId and do not allow a different group.
      tags: [Spond]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpondCredentials'
      responses:
        '200':
          description: Sanitized groups visible to the Spond account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpondGroupSummary'
        '401': { description: Authentication failed }
        '403': { description: Not authorized }
  /api/integrations/spond/snapshot:
    post:
      operationId: proxySpondSnapshot
      summary: Read a Spond snapshot through the optional read-only proxy
      description: >-
        The proxy may call only Spond login and GET endpoints and discards all
        secrets before returning. The requested group must be accessible to the
        supplied Spond account. Date-time bounds are instants; consumers convert
        returned event instants exactly once to the Europe/Zurich wall-clock
        convention used by the application.
      tags: [Spond]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SpondCredentials'
                - type: object
                  properties:
                    groupId: { type: string }
                    subGroupId:
                      type: string
                      description: Optional single Spond subgroup ID to include; omitted means the whole group.
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                  required: [groupId, from, to]
      responses:
        '200':
          description: Normalized Spond group and supported activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpondSnapshot'
        '401': { description: Authentication failed }
        '403': { description: Not authorized }
  /api/squads/{squadId}/spond/import:
    post:
      operationId: importSpondSnapshot
      summary: Atomically apply a reviewed Spond snapshot
      description: >-
        Validates permissions, local revisions, link uniqueness and the complete
        normalized payload before applying all selected changes in one transaction.
        On initial import the selected Spond group is linked to the Squad. Later
        scoped synchronization must use that linked group. Repeating an already
        completed importId returns its original result.
      tags: [Spond]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpondImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpondImportResult'
        '400': { description: Invalid or incomplete import payload }
        '401': { description: Not authenticated }
        '403': { description: Admin or trainer permission required }
        '409': { description: Stale preview, concurrent import, or duplicate Spond link }
  /api/squads/{squadId}/activities:
    get:
      operationId: getSquadActivities
      summary: List activities in a squad
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activities in the squad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      operationId: createSquadActivity
      summary: Create a match or tournament activity
      description: Create a match or tournament activity.
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Activity invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}:
    get:
      operationId: getSquadActivity
      summary: Get an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateSquadActivity
      summary: Update an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Activity invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSquadActivity
      summary: Delete an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Activity deleted
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/status:
    put:
      operationId: updateSquadActivityStatus
      summary: Update an activity status
      description: Set an activity to active or cancelled. Cancelled activities are read-only until restored.
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ActivityStatus'
      responses:
        '200':
          description: Activity status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid activity status or lifecycle transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/invitations:
    put:
      operationId: setSquadActivityInvitations
      summary: Set the complete activity invitation list
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitations]
              properties:
                invitations:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityInvitation'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid invitation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/invitations/{playerId}:
    put:
      operationId: updateSquadActivityInvitation
      summary: Manually update an activity RSVP
      description: Admin/trainer-only manual RSVP fallback. Guardian and player responses are collected in Spond.
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInvitationUpdate'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '403':
          description: Only an authorized admin or trainer may update RSVP data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/selection:
    put:
      operationId: updateSquadActivitySelection
      summary: Update activity team selections
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams:
                  type: array
                  items:
                    $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Selection invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/selection/sent:
    put:
      operationId: markSquadActivitySelectionSent
      summary: Mark activity selection as finalized
      description: >-
        Internal planning state only. Nothing is sent or published; Spond does
        not provide selections and this application does not notify members.
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Selection finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Every team needs at least one responsible person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/teams:
    put:
      operationId: updateSquadActivityTeams
      summary: Replace teams for an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams:
                  type: array
                  items:
                    $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Updated activity teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
  /api/squads/{squadId}/activities/{id}/attendance:
    put:
      operationId: updateSquadActivityAttendance
      summary: Bulk upsert activity attendance
      description: Admins and trainers may record attendance only after the activity starts. Attendance is independent of invitations and selection.
      tags: [Activities]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance]
              properties:
                attendance:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityAttendance'
      responses:
        '200':
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityAttendance'
        '400':
          description: Activity has not started or attendance is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/shirtsets:
    get:
      operationId: getAllShirtSets
      summary: Get all shirt sets in a squad
      description: Retrieve all shirt sets in a specific squad
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved shirt sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShirtSet'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createShirtSet
      summary: Create a new shirt set in a squad
      description: Create a new shirt set in a specific squad
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShirtSetRequest'
      responses:
        '201':
          description: Shirt set created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShirtSet'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/shirtsets/{id}:
    get:
      operationId: getShirtSetById
      summary: Get shirt set by ID
      description: Retrieve a specific shirt set by ID in a specific squad
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shirt set found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShirtSet'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shirt set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateShirtSetById
      summary: Update shirt set by ID
      description: Update a specific shirt set by ID in a specific squad
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShirtSetRequest'
      responses:
        '200':
          description: Shirt set updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShirtSet'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shirt set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteShirtSetById
      summary: Delete shirt set by ID
      description: Delete a specific shirt set by ID in a specific squad
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Shirt set deleted successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shirt set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/shirtsets/{id}/shirts/{shirtNumber}/status:
    put:
      operationId: updateShirtStatus
      summary: Update shirt status
      description: Update the availability status of a single shirt within a shirt set
      tags:
        - Shirt Sets
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: shirtNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, unavailable]
              required:
                - status
      responses:
        '200':
          description: Shirt status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShirtSet'
        '400':
          description: Invalid shirtNumber or status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Shirt set or shirt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
